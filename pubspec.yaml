name: fitness_workout
description: >-
  Fitness workout runner for Flutter. Strength (sets x reps x weight) and
  cardio (intervals/laps) controllers with persistable state, pluggable
  storage, and a stack of drop-in dark-first widgets.
version: 1.0.0
homepage: https://github.com/nexas105/workout_runner_flutter
repository: https://github.com/nexas105/workout_runner_flutter
issue_tracker: https://github.com/nexas105/workout_runner_flutter/issues

topics:
  - fitness
  - workout
  - timer
  - health
  - widgets

environment:
  sdk: ^3.7.0
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
